[project]
name = "rinnsal"
version = "0.1.0"
description = "A declarative DAG execution framework for Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cloudpickle>=3.0",
    "pyyaml>=6.0",
    "protobuf>=4.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
ssh = ["asyncssh>=2.14"]
plotly = ["plotly>=5", "kaleido"]
viewer = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
]
# Needed to talk to a cluster coordinator (ClusterExecutor + rinnsal.sdk).
cluster = ["httpx>=0.25"]
all = ["rinnsal[ssh,plotly,viewer,cluster]"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "mypy>=1.8",
    "ruff>=0.3",
    "black>=24.0",
]

[project.scripts]
rinnsal = "rinnsal.cli.main:main"
rinnsal-viewer = "rinnsal.viewer:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (fast, no I/O)",
    "integration: Integration tests (cross-component)",
    "slow: Performance tests",
    "ssh: Requires SSH setup",
]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 80
target-version = ["py311"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
